name: Release Tomales

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: tomales-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare source release and Homebrew formula
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REPOSITORY" == "EnvyEternal/tomales" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          mkdir -p dist
          git archive --format=tar.gz --prefix="Tomales-$version/" \
            --output="dist/Tomales-$version-source.tar.gz" HEAD
          (cd dist && sha256sum "Tomales-$version-source.tar.gz" > SHA256SUMS)
          python3 scripts/generate-formula.py --repository "$GITHUB_REPOSITORY" \
            --tap EnvyEternal/tomales --archive "dist/Tomales-$version-source.tar.gz" \
            --output dist/tap/Formula/tomales.rb

      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          release_options=()
          if [[ "$version" == 0.* ]]; then release_options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "dist/Tomales-$version-source.tar.gz" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Tomales $version" \
            --notes-file docs/RELEASE_NOTES.md "${release_options[@]}"

      - name: Check out Homebrew tap branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: .build/homebrew-tap

      - name: Publish Homebrew formula
        run: |
          set -euo pipefail
          mkdir -p .build/homebrew-tap/Formula
          cp dist/tap/Formula/tomales.rb .build/homebrew-tap/Formula/tomales.rb
          cd .build/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tomales.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Homebrew formula to ${GITHUB_REF_NAME#v}"
            git push origin HEAD:main
          fi
